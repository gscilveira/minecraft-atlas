<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minecraft Atlas – a wiki em 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Lexend:wght@400;600&display=swap">
<style>
:root{--bg:#16181d;--bg2:#20242b;--ink:#eceff3;--mute:#9aa3b0;--grass:#68b236;--dirt:#8a5a34;--dia:#4de0d0;--gold:#f0c13c;--red:#e5533d;--line:#343a44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1ec;--bg2:#fff;--ink:#1c2128;--mute:#56606d;--grass:#3f8a1c;--dia:#0c8f85;--gold:#9a6f00;--line:#cfd6cc}}
*{box-sizing:border-box}html{scroll-padding-top:70px;color-scheme:dark light}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Lexend,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.px{font-family:'Pixelify Sans',monospace;font-weight:700;line-height:1.1}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:4px;overflow-x:auto;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:3px solid var(--line)}
nav button{flex:none;font:500 15px 'Pixelify Sans',monospace;color:var(--ink);background:var(--bg2);border:2px solid var(--line);padding:8px 14px;cursor:pointer;border-radius:0;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
nav button[aria-selected=true]{background:var(--grass);color:#10200a;border-color:#2f5d12}
nav button:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--dia);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:0 18px 80px}
.panel{display:none}.panel.on{display:block}
.hero{min-height:92vh;display:grid;place-items:center;text-align:center;perspective:900px;position:relative}
.hero h1{font-size:clamp(40px,9vw,92px);margin:0 0 10px;text-shadow:4px 4px 0 var(--dirt)}
.hero p{max-width:520px;margin:0 auto;color:var(--mute)}
.stage{height:300px;perspective:900px;display:grid;place-items:center;margin-bottom:30px;position:relative;width:100%}
.cube{--s:200px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;will-change:transform}
.cube i{position:absolute;inset:0;image-rendering:pixelated;border:2px solid rgba(0,0,0,.35)}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.grass i:nth-child(-n+4){background:linear-gradient(#68b236 0 20%,transparent 20%),repeating-conic-gradient(#8a5a34 0 25%,#75492a 0 50%) 0 0/25% 25%}
.grass i:nth-child(5){background:repeating-conic-gradient(#68b236 0 25%,#559a28 0 50%) 0 0/25% 25%}
.grass i:nth-child(6){background:repeating-conic-gradient(#8a5a34 0 25%,#75492a 0 50%) 0 0/25% 25%}
.mini{position:absolute;--s:56px}.mini i{background:repeating-conic-gradient(var(--a) 0 25%,var(--b) 0 50%) 0 0/50% 50%}
.m1{--a:#4de0d0;--b:#2aa89c;left:12%;top:20%}.m2{--a:#f0c13c;--b:#c99a1a;right:14%;top:10%}.m3{--a:#e5533d;--b:#b53a28;right:26%;bottom:6%}.m4{--a:#9aa3b0;--b:#6f7782;left:24%;bottom:10%}
.hint{font:500 14px 'Pixelify Sans';color:var(--gold);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
h2{font-size:clamp(30px,5vw,48px);margin:40px 0 6px}
.lead{color:var(--mute);max-width:640px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;perspective:1000px}
.card{background:var(--bg2);border:2px solid var(--line);border-left:6px solid var(--grass);padding:16px 18px;transform-origin:50% 100%;will-change:transform,opacity}
.card h3{margin:0 0 4px;font-size:20px}.card p{margin:4px 0;color:var(--mute);font-size:14.5px}
.tag{display:inline-block;font:500 12px 'Pixelify Sans';padding:2px 8px;background:var(--bg);border:1px solid var(--line);margin:0 4px 6px 0;color:var(--dia)}
.go{cursor:pointer;border-left-color:var(--dia)}.go:hover h3{color:var(--dia)}
.bar{height:12px;background:var(--bg);border:1px solid var(--line);margin:6px 0}.bar b{display:block;height:100%;background:var(--dia);transform-origin:left;transform:scaleX(var(--w,0));transition:transform 1s}
.k-Arma,.k-Maça{border-left-color:var(--red)}.k-Armadura{border-left-color:var(--dia)}.k-Maldição{border-left-color:#a35fd6}.k-Arco,.k-Besta,.k-Tridente,.k-Pesca{border-left-color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip,input{font:400 14px Lexend,sans-serif;color:var(--ink);background:var(--bg2);border:2px solid var(--line);padding:8px 12px;border-radius:0}
.chip{cursor:pointer}.chip.on{background:var(--dia);color:#06201d;border-color:var(--dia)}
.steps{counter-reset:s;display:grid;gap:14px;perspective:1000px;margin:0 0 10px}
.steps .card{counter-increment:s;padding-left:64px;position:relative;border-left-color:var(--gold)}
.steps .card:before{content:counter(s);position:absolute;left:14px;top:14px;width:36px;height:36px;display:grid;place-items:center;background:var(--gold);color:#241a00;font:700 20px 'Pixelify Sans'}
.note{background:var(--bg2);border:2px dashed var(--line);padding:14px;margin:18px 0;color:var(--mute);font-size:14.5px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:30px 18px}
.cover{height:560vh;margin:0 calc(50% - 50vw);position:relative}.cv-s{position:sticky;top:0;height:100vh;overflow:hidden}.sky,.stars{position:absolute;inset:0}.stars u{position:absolute;width:3px;height:3px;background:#fff}.orb{position:absolute;width:70px;height:70px;border:4px solid rgba(0,0,0,.2);box-shadow:0 0 60px 10px currentColor}.vp{position:absolute;inset:0;perspective:1300px;display:grid;place-items:center}.world,.b,.ring{transform-style:preserve-3d;will-change:transform}.b i{outline:1px solid transparent;backface-visibility:hidden}.world{width:0;height:0;position:relative}.b,.ring{position:absolute;left:0;top:0}.b i{position:absolute;left:0;top:0;backface-visibility:hidden;box-shadow:inset 0 0 14px rgba(0,0,0,.3)}.brand{position:absolute;top:78px;left:0;right:0;text-align:center;font-size:clamp(34px,8vw,80px);color:#fff;margin:0;text-shadow:4px 4px 0 var(--dirt)}.capn{position:absolute;left:0;right:0;bottom:13vh;text-align:center;padding:0 18px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7)}.capn h2{margin:0 0 4px;font-size:clamp(28px,5vw,44px)}.capn p{margin:2px 0}.prog{position:absolute;left:18px;right:18px;bottom:4vh;height:6px;background:rgba(255,255,255,.25)}.prog b{display:block;height:100%;background:var(--gold);width:0}
.vp>.world{grid-area:1/1}.flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(#f0cfff,#7a2fb5 60%,#2a0b4a)}.pl{position:absolute;top:-34px;transform:translateX(-50%);font:500 13px 'Pixelify Sans',monospace;color:#fff;background:#0007;border:2px solid #fff4;padding:3px 9px;cursor:pointer}.pl.on{background:var(--gold);color:#241a00;border-color:var(--gold)}
.fg{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}.iso{width:100%;display:block;background:linear-gradient(var(--bg),var(--bg2));border:1px solid var(--line);margin:8px 0}ol{padding-left:20px;margin:6px 0;color:var(--mute);font-size:14px}li{margin:3px 0}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.card{transform:none!important;opacity:1!important}.bar b{transition:none}}
</style>
</head>

const fcard=f=>{const d=FD[f[0]];return card(f[0],`<svg class="iso" viewBox="0 0 180 130" role="img" aria-label="Diagrama 3D: ${f[0]}">${iso(d[0])}</svg><p><b>Materiais:</b> ${d[1]}</p><ol>${d[2].split('|').map(s=>`<li>${s}</li>`).join('')}</ol>${FS[f[0]]}`,tag(FC[f[0]])+tag("Dificuldade: "+["","fácil","média","difícil"][f[1]])+tag(f[2]),'k-Ferramenta')};
hooks.farms=()=>{const f=t=>{const L=F.filter(x=>t=='Todas'||FC[x[0]]==t);$('#fcn').textContent=L.length+" farms";fill('#fgd',L,fcard)};f('Todas');chips('#ff',f)};
show(location.hash.slice(1));
</script>
